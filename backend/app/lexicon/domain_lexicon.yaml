table_patterns:
  # 5 类预定义表，required_headers 全部命中（子串匹配，大小写不敏感）才归类
  project_info:
    required_headers: ["项目", "客户"]
    optional_headers: ["车型", "供应商", "报告编号"]
  team:
    required_headers: ["姓名", "角色"]
    optional_headers: ["部门", "联系方式"]
  defect_list:
    required_headers: ["序号", "故障描述"]
    optional_headers: ["位置", "里程", "首次发生"]
  measurement:
    required_headers: ["项目", "实测值"]
    optional_headers: ["目标值", "上限", "下限", "单位", "判定"]
  change_log:
    required_headers: ["版本", "日期"]
    optional_headers: ["变更说明", "作者"]