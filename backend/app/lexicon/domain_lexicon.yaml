# 8D 报告知识图谱 - 领域词典 v0.1
# 三大类：同义词规约、否定词检测、章节路由关键词
# 概念层种子词表也放这里（v0.1 不创建新概念，仅链接）

synonyms:
  # 失效模式
  - canonical: "弹簧断裂"
    aliases: ["弹簧断", "弹簧失效", "spring fracture", "spring failure"]
  - canonical: "阀体泄漏"
    aliases: ["阀泄漏", "阀漏气", "valve leakage", "valve leak"]
  - canonical: "螺栓断裂"
    aliases: ["螺栓断", "螺栓失效", "bolt fracture", "bolt failure"]
  - canonical: "密封失效"
    aliases: ["密封破坏", "密封泄漏", "seal failure", "seal leak"]
  - canonical: "轴承损坏"
    aliases: ["轴承破坏", "轴承断裂", "bearing failure"]
  # 缺陷类型
  - canonical: "气孔"
    aliases: ["气泡", "porosity", "gas hole"]
  - canonical: "夹杂"
    aliases: ["夹杂物", "杂质", "inclusion"]
  - canonical: "裂纹"
    aliases: ["裂缝", "crack"]
  - canonical: "疏松"
    aliases: ["孔隙", "porosity"]
  - canonical: "脱碳"
    aliases: ["表面脱碳", "decarburization"]
  - canonical: "腐蚀"
    aliases: ["锈蚀", "corrosion", "oxidation"]
  # 检测方法
  - canonical: "断口分析"
    aliases: ["断口检查", "fractographic analysis", "fractography"]
  - canonical: "金相分析"
    aliases: ["金相检验", "metallographic analysis"]
  - canonical: "硬度试验"
    aliases: ["硬度测试", "hardness test"]
  - canonical: "化学成分分析"
    aliases: ["成分分析", "chemical analysis"]

