# v0.1: frontend & schema-sync jobs disabled, will re-enable after frontend skeleton is generated

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Prepare CI .env
        run: cp .env.example .env

      - name: Ruff check
        run: cd backend && uv run ruff check .

      - name: Ruff format check
        run: cd backend && uv run ruff format --check .

      - name: Mypy check
        continue-on-error: true
        run: cd backend && uv run mypy app

      - name: Pytest
        run: cd backend && uv run pytest -q --cov=app --cov-report=term-missing -m "not integration"

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown format
        run: |
          command -v prettier || npm install -g prettier
          find docs -name "*.md" -exec prettier --check {} \; || true
